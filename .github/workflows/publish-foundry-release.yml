name: Publish Foundry Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the leading v (for example 1.0.0 or 1.1.0-beta.1)
        required: true
        type: string
      release_type:
        description: GitHub Release visibility
        required: true
        default: draft
        type: choice
        options:
          - draft
          - prerelease
          - stable
      allow_unsigned_stable:
        description: Release-owner approval to publish stable without Authenticode signing
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: foundry-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_OUTPUT: ${{ github.workspace }}\artifacts\github-release
      V1_RELEASE_OUTPUT: ${{ github.workspace }}\artifacts\v1-release
      RELEASE_VERSION_INPUT: ${{ inputs.version }}
      RELEASE_TYPE_INPUT: ${{ inputs.release_type }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release inputs
        id: release
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION_INPUT.Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Version '$version' is not valid semantic version text."
          }
          if ($env:RELEASE_TYPE_INPUT -eq 'stable' -and $version.Contains('-')) {
            throw 'A stable GitHub Release cannot use a prerelease version.'
          }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub Release $tag already exists. Releases are immutable inputs; choose a new version."
          }
          $global:LASTEXITCODE = 0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Git tag $tag already exists without a release. Review it before continuing."
          }
          $global:LASTEXITCODE = 0
          $publishedAtUtc = [DateTimeOffset]::UtcNow.ToUniversalTime().ToString('O')
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "published_at_utc=$publishedAtUtc" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          winget install --id JRSoftware.InnoSetup --exact --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Run full release regression gate
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Build native setup and updater
        shell: pwsh
        run: |
          .\eng\desktop\package-desktop.ps1 `
            -Configuration Release `
            -Version '${{ steps.release.outputs.version }}' `
            -PublishedAtUtc ([DateTimeOffset]'${{ steps.release.outputs.published_at_utc }}') `
            -OutputDirectory $env:RELEASE_OUTPUT

      - name: Verify release assets
        shell: pwsh
        run: |
          .\eng\desktop\verify-desktop-release.ps1 `
            -Version '${{ steps.release.outputs.version }}' `
            -ReleaseDirectory $env:RELEASE_OUTPUT

      - name: Build and independently verify stable v1 bundle
        if: ${{ inputs.release_type == 'stable' && inputs.version == '1.0.0' }}
        shell: pwsh
        run: |
          $parameters = @{
            Configuration = 'Release'
            Version = '1.0.0'
            PublishedAtUtc = [DateTimeOffset]'${{ steps.release.outputs.published_at_utc }}'
            OutputDirectory = $env:V1_RELEASE_OUTPUT
          }
          if ('${{ inputs.allow_unsigned_stable }}' -eq 'true') {
            $parameters.AllowUnsignedStable = $true
          }
          .\eng\release\package-v1.ps1 @parameters
          $root = Join-Path $env:V1_RELEASE_OUTPUT 'CreatorsForge-Foundry-1.0.0'
          $expectedHash = ((Get-Content -LiteralPath (Join-Path $root 'V1-RELEASE-SHA256.txt') -Raw).Trim() -split '\s+')[0]
          .\eng\release\verify-v1-release.ps1 `
            -ReleaseDirectory $root `
            -ExpectedManifestSha256 $expectedHash

      - name: Retain verified workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: creators-forge-foundry-${{ steps.release.outputs.version }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.RELEASE_OUTPUT }}\CreatorsForge-Foundry-${{ steps.release.outputs.version }}-Setup.exe
            ${{ env.RELEASE_OUTPUT }}\CreatorsForge-Foundry-${{ steps.release.outputs.version }}-Update.exe
            ${{ env.RELEASE_OUTPUT }}\foundry-update.json

      - name: Retain verified stable v1 evidence
        if: ${{ inputs.release_type == 'stable' && inputs.version == '1.0.0' }}
        uses: actions/upload-artifact@v7
        with:
          name: creators-forge-foundry-1.0.0-stable-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ env.V1_RELEASE_OUTPUT }}\CreatorsForge-Foundry-1.0.0\CreatorsForge-Foundry-1.0.0-win-x64.zip
            ${{ env.V1_RELEASE_OUTPUT }}\CreatorsForge-Foundry-1.0.0-release.zip
            ${{ env.V1_RELEASE_OUTPUT }}\CreatorsForge-Foundry-1.0.0\V1-RELEASE-SHA256.txt

      - name: Create GitHub Release and upload assets
        id: github_release
        shell: pwsh
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $tag = '${{ steps.release.outputs.tag }}'
          $setup = Join-Path $env:RELEASE_OUTPUT "CreatorsForge-Foundry-$version-Setup.exe"
          $updater = Join-Path $env:RELEASE_OUTPUT "CreatorsForge-Foundry-$version-Update.exe"
          $manifest = Join-Path $env:RELEASE_OUTPUT 'foundry-update.json'
          $arguments = @(
            'release', 'create', $tag,
            $setup, $updater, $manifest,
            '--repo', $env:GITHUB_REPOSITORY,
            '--target', $env:GITHUB_SHA,
            '--title', "Creators Forge Foundry $version",
            '--fail-on-no-commits'
          )
          if ($env:RELEASE_TYPE_INPUT -eq 'stable' -and $version -eq '1.0.0') {
            $v1Root = Join-Path $env:V1_RELEASE_OUTPUT 'CreatorsForge-Foundry-1.0.0'
            $arguments += (Join-Path $v1Root 'CreatorsForge-Foundry-1.0.0-win-x64.zip')
            $arguments += (Join-Path $env:V1_RELEASE_OUTPUT 'CreatorsForge-Foundry-1.0.0-release.zip')
            $arguments += (Join-Path $v1Root 'V1-RELEASE-SHA256.txt')
            $arguments += '--notes-file'
            $arguments += 'docs/release/v1.0.0.md'
          } else {
            $arguments += '--generate-notes'
          }
          switch ($env:RELEASE_TYPE_INPUT) {
            'draft' { $arguments += '--draft' }
            'prerelease' { $arguments += '--prerelease'; $arguments += '--latest=false' }
            'stable' { $arguments += '--latest' }
          }
          gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE."
          }
          $releaseUrl = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq .url
          "url=$releaseUrl" >> $env:GITHUB_OUTPUT
          "### Foundry release created`n`n- Version: $version`n- Type: $env:RELEASE_TYPE_INPUT`n- URL: $releaseUrl" >> $env:GITHUB_STEP_SUMMARY
